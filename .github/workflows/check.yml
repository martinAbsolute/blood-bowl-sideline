name: Check application
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm run build
        env:
          NEXT_PUBLIC_CONVEX_URL: https://expert-grasshopper-80.convex.cloud
          NEXT_PUBLIC_CONVEX_SITE_URL: https://expert-grasshopper-80.convex.site
          NEXT_PUBLIC_SITE_URL: https://www.sideline.com.ua
