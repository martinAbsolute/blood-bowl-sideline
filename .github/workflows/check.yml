name: Check application
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_CONVEX_URL: https://expert-grasshopper-80.convex.cloud
          NEXT_PUBLIC_CONVEX_SITE_URL: https://expert-grasshopper-80.convex.site
          NEXT_PUBLIC_SITE_URL: https://blood-bowl-sideline.vercel.app
