allowBuilds:
  esbuild: true
  tree-sitter-python: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - "@generaltranslation/compiler@1.3.64"
  - "@generaltranslation/python-extractor@0.2.62"
  - "@generaltranslation/react-core@11.4.12"
  - "@generaltranslation/supported-locales@2.1.43"
  - "@generaltranslation/vue-extractor@0.1.21"
  - "@shadcn/registry@0.1.4"
  - generaltranslation@9.5.7
  - gt-i18n@1.0.38
  - gt-next@11.4.12
  - gt-react@11.4.12
  - gt@2.26.5
  - lucide-react@1.57.0
  - react-dom@19.3.1
  - react@19.3.1
  - shadcn@4.21.5
overrides:
  # Browser tests use happy-dom; exclude Vitest's unused optional environment.
  "vitest>jsdom": "-"
  # GT pins an alpha of Clack despite a compatible stable release being available.
  "gt>@clack/prompts": "1.8.1"
patchedDependencies:
  "@convex-dev/auth@0.0.96": patches/@convex-dev__auth@0.0.96.patch
