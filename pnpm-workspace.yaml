allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  esbuild: true
  tree-sitter-python: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - "@shadcn/registry@0.1.4"
  - lucide-react@1.57.0
  - react-dom@19.3.1
  - react@19.3.1
  - shadcn@4.21.5
overrides:
  # Browser tests use happy-dom; exclude Vitest's unused optional environment.
  "vitest>jsdom": "-"
patchedDependencies:
  "@convex-dev/auth@0.0.96": patches/@convex-dev__auth@0.0.96.patch
